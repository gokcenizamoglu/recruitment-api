name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: recruitment
          POSTGRES_USER: recruitment
          POSTGRES_PASSWORD: recruitment
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U recruitment -d recruitment"
          --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      SECRET_KEY: ci-only-test-key-2026-a7F9qP2vR8mK4xT6zN3hW5eY1cU0-long-placeholder
      DEBUG: "false"
      POSTGRES_HOST: localhost
      POSTGRES_DB: recruitment
      POSTGRES_USER: recruitment
      POSTGRES_PASSWORD: recruitment
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check
      - name: Django deployment security check
        env:
          # CI-only value; never use this as a production secret.
          SECRET_KEY: ci-only-security-check-key-2026-not-a-production-secret-9f7a3b1c5d8e2a6f
          ALLOWED_HOSTS: localhost
          SECURE_SSL_REDIRECT: "true"
          SESSION_COOKIE_SECURE: "true"
          CSRF_COOKIE_SECURE: "true"
          SECURE_HSTS_SECONDS: "31536000"
          SECURE_HSTS_INCLUDE_SUBDOMAINS: "true"
          SECURE_HSTS_PRELOAD: "true"
          TRUST_PROXY_SSL_HEADER: "true"
        run: python manage.py check --deploy
      - run: python manage.py collectstatic --noinput
      - run: pytest --cov=. --cov-report=term-missing
