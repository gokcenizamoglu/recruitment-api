[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["DJ001"]

[tool.ruff.lint.per-file-ignores]
# Curated job descriptions intentionally remain readable as single data values.
"jobs/management/commands/seed_demo.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
